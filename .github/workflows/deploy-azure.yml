name: 66SMS Deploy Azure

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  API_IMAGE_NAME: 66sms-api
  RESOURCE_GROUP: 66sms-rg
  CONTAINER_APP: ca-66sms-api

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: 66SMS.Backend
          file: 66SMS.Backend/Dockerfile
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.API_IMAGE_NAME }}:latest
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        
      - name: Update Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
  
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: action/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 66SMS.Frontend/package-lock.json

      - name: Build Frontend
        working-directory: 66SMS.Frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      
      - name: Deploy Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 66SMS.Frontend/dist
          skip_app_build: true
          skip_api_build: true
