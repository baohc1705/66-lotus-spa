name: 66SMS CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RG: 66sms-rg
  APP: ca-66sms-api

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: 66SMS.Backend
          file: 66SMS.Backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/66sms-api:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/66sms-api:latest

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/cli@v2
        with:
          inlineScript: >
            az containerapp update
            --name ${{ env.APP }}
            --resource-group ${{ env.RG }}
            --image ghcr.io/${{ steps.meta.outputs.owner }}/66sms-api:${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 66SMS.Frontend/package-lock.json

      - working-directory: 66SMS.Frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 66SMS.Frontend/dist
          skip_app_build: true
